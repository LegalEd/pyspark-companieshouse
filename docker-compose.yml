services:
  spark-connect:
    image: apache/spark:4.1.3
    container_name: spark-connect
    environment:
      # start-connect-server.sh normally daemonizes, which would make the
      # container exit immediately. This keeps it in the foreground.
      SPARK_NO_DAEMONIZE: "true"
    # Spark 4.x bundles Spark Connect, so no --packages flag is needed.
    command: >
      /opt/spark/sbin/start-connect-server.sh
      --conf spark.driver.bindAddress=0.0.0.0
      --master local[*]
    ports:
      - "15002:15002"   # Spark Connect (gRPC) - what the client connects to
      - "4040:4040"     # Spark UI
    volumes:
      - ./data:/data:ro # local ./data folder, readable by the server as /data
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark      # dev only - change for anything real
      POSTGRES_DB: spark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: loads the CSV into Postgres, then exits.
  csv-to-postgres:
    image: python:3.12-slim
    container_name: csv-to-postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spark:spark@postgres:5432/spark
      CSV_FILE: /data/data.csv      # change to your CSV's filename
      TABLE_NAME: records
    # Installs the driver on each run (needs internet), then loads the CSV.
    command: sh -c "pip install --no-cache-dir -q 'psycopg[binary]' && python /app/load_csv.py"
    volumes:
      - ./data:/data:ro
      - ./load_csv.py:/app/load_csv.py:ro
    restart: "no"

volumes:
  pgdata:
